services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: myself_kine
      POSTGRES_USER: myself_kine
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myself_kine -d myself_kine"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
