name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  verify-and-build:
    name: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository policy
        run: ./scripts/ci/repository-checks.sh
      - name: Formatting
        run: npm run format:check
      - name: Static analysis
        run: npm run lint
      - name: Type checking
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Build once
        run: npm run artifact:build
      - name: Record checksums
        run: cd artifacts && sha256sum *.tgz > SHA256SUMS
      - name: Upload immutable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  development:
    name: development-ready
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-${{ github.sha }}
          path: artifacts
      - name: Verify artifact integrity
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: No cloud target configured
        run: echo 'Development artifact is ready; deployment is intentionally disabled.'

  staging:
    name: staging-ready
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Download the same tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-${{ github.sha }}
          path: artifacts
      - name: Verify artifact integrity
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Empty staging environment
        run: echo 'Staging exists as a protected GitHub environment; no cloud deployment is configured.'
