name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  verify:
    name: verify-clean-context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-run mandatory controls
        run: ./scripts/ci/repository-checks.sh
      - name: Deployment intentionally disabled
        run: |
          echo 'No deployable application or approved PaaS target exists yet.'
          echo 'This workflow must fail closed rather than publish an untested placeholder.'

